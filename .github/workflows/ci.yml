name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test-lock.txt
      - run: python -m pip install --require-hashes -r backend/requirements-test-lock.txt
      - run: python scripts/verify_dependency_boundaries.py
      - run: python scripts/verify_supply_chain_artifacts.py
      - run: python scripts/generate_brand_assets.py --check
      - run: python scripts/verify_model_registry.py
      - run: python scripts/verify_documentation_contracts.py
      - run: python scripts/verify_api_access_policy.py
      - run: python scripts/verify_test_governance.py
      - run: python scripts/verify_performance_contract.py
      - name: Reject executable pickle deserialization in production code
        shell: bash
        run: |
          if grep -R -n -E '(^|[[:space:]])(import[[:space:]]+pickle|from[[:space:]]+pickle[[:space:]]+import)' backend/app; then
            echo "Production code must not import pickle. Persist fixed-format data instead."
            exit 1
          fi
      - run: python -m pytest backend/tests -q
        env:
          GODFIN_TESTING: "1"
      - run: python -m pip install pip-audit==2.10.1
      - run: python scripts/audit_python_dependencies.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run verify:a11y
        working-directory: frontend
      - run: npm run test:auth
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run verify:contracts
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm audit --omit=dev
        working-directory: website

  website-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            playwright-tests/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm ci
        working-directory: playwright-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: playwright-tests
      - name: Start production website
        shell: bash
        run: |
          npm --prefix website run start > "$RUNNER_TEMP/godfin-website.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5300 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/godfin-website.log"
          exit 1
      - run: npm run test:website
        working-directory: playwright-tests
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: website-browser-matrix-diagnostics
          path: |
            playwright-tests/reports/website-artifacts
            ${{ runner.temp }}/godfin-website.log
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            playwright-tests/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements-lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: playwright-tests
      - run: npm audit
        working-directory: playwright-tests
      - run: npx playwright install --with-deps chromium
        working-directory: playwright-tests
      - name: Generate redacted statement fixture
        run: python playwright-tests/fixtures/generate_redacted_statement.py "$RUNNER_TEMP/redacted-statement.pdf"
      - name: Start local app
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 5100 --app-dir backend > "$RUNNER_TEMP/godfin-backend.log" 2>&1 &
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 5200 > "$RUNNER_TEMP/godfin-frontend.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5100/api/v1/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5200 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/godfin-backend.log"
          cat "$RUNNER_TEMP/godfin-frontend.log"
          exit 1
        env:
          DB_PATH: ${{ runner.temp }}/godfin-e2e.db
          GODFIN_DISABLE_KEYCHAIN: "1"
          GODFIN_ENCRYPTION_KEY_FILE: ${{ runner.temp }}/godfin-e2e.key
      - run: npx playwright test tests/production-smoke.test.js
        working-directory: playwright-tests
        env:
          CI: "true"
          GODFIN_E2E_STATEMENT: ${{ runner.temp }}/redacted-statement.pdf
      - name: Run mobile accessibility smoke
        run: npx playwright test --config=playwright.legacy.config.js tests/accessibility-smoke.test.js
        working-directory: playwright-tests
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            playwright-tests/reports
            ${{ runner.temp }}/godfin-backend.log
            ${{ runner.temp }}/godfin-frontend.log
          retention-days: 7

  desktop-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run audit:prod
        working-directory: desktop
      - run: npm run test:privacy
        working-directory: desktop
      - run: npm run test:update
        working-directory: desktop
      - run: |
          node --check main.cjs
          node --check scripts/after-pack.cjs
          node --check scripts/build-assets.mjs
          node --check scripts/verify-package.mjs
          node --check ../packaging/stage-release-assets.mjs
          node --check ../packaging/prepare-update-feed.mjs
          node --check ../packaging/create-release-compatibility.mjs
          node --check ../packaging/create-release-provenance.mjs
          node --check ../packaging/verify-release-provenance.mjs
          node --check ../packaging/verify-rollback-transition.mjs
        working-directory: desktop
