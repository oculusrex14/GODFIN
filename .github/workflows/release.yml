name: Build signed draft release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: --mac --arm64
            artifact: macos-arm64
            require_signing: "true"
          - name: macOS x64
            os: macos-15-intel
            target: --mac --x64
            artifact: macos-x64
            require_signing: "true"
          - name: Windows x64
            os: windows-latest
            target: --win --x64
            artifact: windows-x64
            require_signing: "true"
          - name: Linux x64
            os: ubuntu-latest
            target: --linux --x64
            artifact: linux-x64
            require_signing: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-build-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements-build-lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - name: Build frontend and frozen backend
        run: npm run build:assets
        working-directory: desktop
        env:
          PYTHON_BIN: python
      - name: Build signed installers
        shell: bash
        run: |
          signing_flag=""
          if [[ "${{ matrix.require_signing }}" == "true" ]]; then
            signing_flag="-c.forceCodeSigning=true"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          npx electron-builder ${{ matrix.target }} --publish never $signing_flag
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Generate Homebrew cask
        shell: bash
        run: |
          arm_dmg="$(find artifacts/macos-arm64 -name '*.dmg' -print -quit)"
          intel_dmg="$(find artifacts/macos-x64 -name '*.dmg' -print -quit)"
          node packaging/homebrew/render-cask.mjs \
            --version "${RELEASE_TAG#v}" \
            --arm "$arm_dmg" \
            --intel "$intel_dmg" \
            --output artifacts/godfin.rb
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          find artifacts -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > artifacts/SHA256SUMS.txt
      - name: Create private draft release with all assets
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "GODFIN ${RELEASE_TAG#v}" \
            "${files[@]}"
