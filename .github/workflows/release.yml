name: Build signed draft release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: --mac --arm64
            artifact: macos-arm64
            require_signing: "true"
          - name: macOS x64
            os: macos-15-intel
            target: --mac --x64
            artifact: macos-x64
            require_signing: "true"
          - name: Windows x64
            os: windows-latest
            target: --win --x64
            artifact: windows-x64
            require_signing: "true"
          - name: Linux x64
            os: ubuntu-latest
            target: --linux --x64
            artifact: linux-x64
            require_signing: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-build-lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements-build-lock.txt
      - name: Bind the build to the exact versioned tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(node -p "require('./desktop/package.json').version")"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - run: python scripts/verify_dependency_boundaries.py
      - run: python scripts/verify_supply_chain_artifacts.py
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - name: Build frontend and frozen backend
        run: npm run build:assets
        working-directory: desktop
        env:
          PYTHON_BIN: python
      - name: Build signed installers
        shell: bash
        run: |
          signing_flag=""
          if [[ "${{ matrix.require_signing }}" == "true" ]]; then
            signing_flag="-c.forceCodeSigning=true"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          npx electron-builder ${{ matrix.target }} --publish never $signing_flag
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify package startup, storage, memory, signature, and fuses
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum npm run verify:package
          else
            npm run verify:package
          fi
        working-directory: desktop
        env:
          GODFIN_REQUIRE_SIGNING: ${{ matrix.require_signing }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Stage uniquely named release assets
        run: node packaging/stage-release-assets.mjs --input artifacts --output release-assets
      - name: Add exact license and supply-chain evidence
        shell: bash
        run: |
          cp LICENSE release-assets/LICENSE
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cp sbom/godfin.cdx.json release-assets/godfin.cdx.json
          cp supply-chain/legal-clearance.json release-assets/legal-clearance.json
          python scripts/verify_supply_chain_artifacts.py --artifact-dir release-assets
      - name: Bind release to database compatibility and its immediate predecessor
        shell: bash
        run: |
          previous_tag="$(git tag --list 'v*.*.*' --sort=-version:refname \
            | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
          previous_version="${previous_tag#v}"
          if [[ -z "$previous_tag" ]]; then previous_version="none"; fi
          node packaging/create-release-compatibility.mjs \
            --version "${RELEASE_TAG#v}" \
            --previous-version "$previous_version" \
            --output release-assets/release-compatibility.json
      - name: Generate Homebrew cask
        shell: bash
        run: |
          arm_dmg="$(find artifacts/macos-arm64 -name '*.dmg' -print -quit)"
          intel_dmg="$(find artifacts/macos-x64 -name '*.dmg' -print -quit)"
          node packaging/homebrew/render-cask.mjs \
            --version "${RELEASE_TAG#v}" \
            --arm "$arm_dmg" \
            --intel "$intel_dmg" \
            --output release-assets/godfin.rb
      - name: Bind every candidate byte to the workflow and source commit
        shell: bash
        run: |
          node packaging/create-release-provenance.mjs \
            --input release-assets \
            --output release-assets/release-provenance.intoto.json \
            --version "${RELEASE_TAG#v}" \
            --repository "${{ github.repository }}" \
            --commit "$(git rev-parse HEAD)" \
            --ref "refs/tags/${RELEASE_TAG}" \
            --workflow ".github/workflows/release.yml" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node packaging/verify-release-provenance.mjs \
            --input release-assets \
            --provenance release-assets/release-provenance.intoto.json
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )
      - name: Attest provenance in GitHub Enterprise Cloud when enabled
        if: vars.GODFIN_ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
      - name: Attest the CycloneDX SBOM when enabled
        if: vars.GODFIN_ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
          sbom-path: release-assets/godfin.cdx.json
      - name: Create private draft release with all assets
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable candidates are never rebuilt in place."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "GODFIN ${RELEASE_TAG#v}" \
            "${files[@]}"
