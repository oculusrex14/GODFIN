name: Refresh reviewed Python locks

on:
  schedule:
    - cron: "17 4 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-python-locks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.14 pip-audit==2.10.1
      - name: Regenerate universal hash locks deliberately
        run: |
          uv pip compile --upgrade --universal --python-version 3.12 --generate-hashes \
            backend/requirements.txt --output-file backend/requirements-lock.txt
          uv pip compile --upgrade --universal --python-version 3.12 --generate-hashes \
            backend/requirements-test.txt --output-file backend/requirements-test-lock.txt
          uv pip compile --upgrade --universal --python-version 3.12 --generate-hashes \
            backend/requirements-build.txt --output-file backend/requirements-build-lock.txt
      - name: Verify lock boundaries
        run: python scripts/verify_dependency_boundaries.py
      - name: Record gates that require human review
        id: review-gates
        continue-on-error: true
        shell: bash
        run: |
          status=0
          python scripts/audit_python_dependencies.py || status=1
          python scripts/generate_supply_chain_artifacts.py || status=1
          python scripts/verify_supply_chain_artifacts.py || status=1
          {
            echo "## Python dependency refresh"
            if [[ "$status" -eq 0 ]]; then
              echo "Automated vulnerability, license-inventory, SBOM, and notice gates passed."
            else
              echo "At least one review gate failed. This is expected when versions introduce an unreviewed package or license; the PR remains blocked until a human updates and verifies the evidence."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Open or update a private review PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_OUTCOME: ${{ steps.review-gates.outcome }}
        run: |
          if git diff --quiet; then
            echo "Locks are already current."
            exit 0
          fi
          branch="automation/python-dependency-locks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git checkout -B "$branch"
          git add backend/requirements-lock.txt \
            backend/requirements-test-lock.txt \
            backend/requirements-build-lock.txt \
            sbom/godfin.cdx.json THIRD_PARTY_NOTICES.md
          git commit -m "chore(deps): refresh reviewed Python locks"
          git push --force-with-lease origin "$branch"
          if [[ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(deps): refresh reviewed Python locks" \
              --body "Automated hash-lock refresh. Review-gate outcome: ${REVIEW_GATE_OUTCOME}. A human must review dependency, license, SBOM, audit, and frozen-package changes before merge; required CI remains fail-closed."
          fi
