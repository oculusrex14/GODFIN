name: Promote signed release to update feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed draft tag to promote (for example v1.0.0)
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_STAGED_RELEASE for 5%, or ADVANCE_AFTER_HEALTH_REVIEW for 25–100%
        required: true
        type: string
      rollout_percentage:
        description: Percentage of installation cohorts offered this reviewed release
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "25"
          - "50"
          - "100"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Enforce the staged-rollout stop condition
        shell: bash
        run: |
          if [[ "${{ inputs.rollout_percentage }}" == "5" ]]; then
            test "${{ inputs.confirmation }}" = "PUBLISH_STAGED_RELEASE"
          else
            test "${{ inputs.confirmation }}" = "ADVANCE_AFTER_HEALTH_REVIEW"
          fi
      - name: Download reviewed draft assets
        run: gh release download "${{ inputs.tag }}" --dir artifacts
      - name: Verify release checksums
        shell: bash
        run: (cd artifacts && sha256sum --check SHA256SUMS.txt)
      - name: Verify exact provenance, SBOM, notices, and legal clearance
        run: |
          node packaging/verify-release-provenance.mjs \
            --input artifacts \
            --provenance artifacts/release-provenance.intoto.json
          python scripts/verify_supply_chain_artifacts.py \
            --artifact-dir artifacts \
            --promotion
      - name: Verify GitHub attestations when enabled
        if: vars.GODFIN_ENABLE_GITHUB_ATTESTATIONS == 'true'
        shell: bash
        run: |
          while read -r _ asset; do
            asset="${asset#\*}"
            asset="${asset#./}"
            gh attestation verify "artifacts/${asset}" \
              --repo "${{ github.repository }}"
          done < artifacts/SHA256SUMS.txt
      - name: Reject unsigned or incomplete release sets
        shell: bash
        run: |
          test -n "$(find artifacts -name '*.dmg' -print -quit)"
          test -n "$(find artifacts -name '*.exe' -print -quit)"
          test -n "$(find artifacts -name '*.AppImage' -print -quit)"
          test -f artifacts/macos-arm64-latest-mac.yml
          test -f artifacts/macos-x64-latest-mac.yml
          test -f artifacts/windows-x64-latest.yml
          test -f artifacts/linux-x64-latest-linux.yml
          test -f artifacts/release-compatibility.json
          test -f artifacts/release-provenance.intoto.json
          test -f artifacts/godfin.cdx.json
          test -f artifacts/THIRD_PARTY_NOTICES.md
          test -f artifacts/legal-clearance.json
      - name: Require the same staged tag before advancing its rollout
        if: inputs.rollout_percentage != '5'
        shell: bash
        run: |
          for channel in darwin-arm64 darwin-x64 win32-x64 linux-x64; do
            aws s3 cp \
              "s3://${R2_BUCKET}/${channel}/release-compatibility.json" \
              "current-${channel}-compatibility.json" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            cmp \
              "current-${channel}-compatibility.json" \
              artifacts/release-compatibility.json
          done
      - name: Prepare architecture-specific update metadata
        run: |
          node packaging/prepare-update-feed.mjs \
            --input artifacts \
            --output update-feed \
            --version "${{ inputs.tag }}" \
            --rollout-percentage "${{ inputs.rollout_percentage }}"
      - name: Publish immutable version and current update metadata
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          aws s3 sync artifacts "s3://${R2_BUCKET}/${version}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress
          aws s3 sync update-feed "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress
